<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BoseAI</title>
    <link rel="manifest" href="./manifest.json">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            background: #101010;
        }

        #chat {
            height: calc(100vh - 140px);
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 30px;
        }

        .message {
            margin: 12px 0;
            padding: 13px 16px;
            border-radius: 16px;
            max-width: 80%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user {
            background: #333;
            margin-left: auto;
        }

        .ai {
            background: #1d1d1d;
            margin-right: auto;
        }

        #inputArea {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #101010;
            border-top: 1px solid #333;
        }

        #userInput {
            flex: 1;
            min-width: 0;
            padding: 14px 16px;
            border-radius: 25px;
            border: 1px solid #444;
            outline: none;
            background: #222;
            color: white;
            font-size: 16px;
        }

        #userInput::placeholder {
            color: #888;
        }

        #sendButton {
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        #sendButton:disabled {
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <header>
        🤖 BoseAI
    </header>

    <div id="chat">
        <div class="message ai">
            Hello! I'm BoseAI. 👋<br>
            Your local AI assistant is being built.
        </div>
    </div>

    <div id="inputArea">

        <input
            id="userInput"
            type="text"
            placeholder="Ask BoseAI..."
            autocomplete="off"
        >

        <button id="sendButton">
            Send
        </button>

    </div>


    <script type="module">

        import { BoseAIEngine } from "./src/core/engine.js";


        const engine = new BoseAIEngine();


        const input = document.getElementById("userInput");

        const sendButton = document.getElementById("sendButton");

        const chat = document.getElementById("chat");


        function addMessage(text, type) {

            const message = document.createElement("div");

            message.className = "message " + type;

            message.textContent = text;

            chat.appendChild(message);

            chat.scrollTop = chat.scrollHeight;
        }


        async function sendMessage() {

            const message = input.value.trim();

            if (!message) {
                return;
            }


            addMessage(message, "user");

            input.value = "";

            sendButton.disabled = true;


            const thinkingMessage = document.createElement("div");

            thinkingMessage.className = "message ai";

            thinkingMessage.textContent = "Thinking locally...";

            chat.appendChild(thinkingMessage);

            chat.scrollTop = chat.scrollHeight;


            try {

                const reply = await engine.generate(message);

                thinkingMessage.remove();

                addMessage(reply, "ai");

            }

            catch (error) {

                console.error(error);

                thinkingMessage.remove();

                addMessage(
                    "BoseAI could not start the local engine.",
                    "ai"
                );

            }


            sendButton.disabled = false;

            input.focus();
        }


        sendButton.addEventListener(
            "click",
            sendMessage
        );


        input.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );

    </script>

</body>

</html>
