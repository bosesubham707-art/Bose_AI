<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoseAI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }

        #chat {
            height: calc(100vh - 140px);
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin: 12px 0;
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 80%;
        }

        .user {
            background: #333;
            margin-left: auto;
        }

        .ai {
            background: #1d1d1d;
            margin-right: auto;
        }

        #inputArea {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            padding: 10px;
            box-sizing: border-box;
            background: #101010;
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 25px;
            border: 1px solid #444;
            background: #222;
            color: white;
        }

        button {
            margin-left: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            background: #ffffff;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>🤖 BoseAI</header>

<div id="chat"></div>

<div id="inputArea">
    <input id="userInput" placeholder="Ask BoseAI..." />
    <button onclick="sendMessage()">Send</button>
</div>

<script>

function sendMessage() {

    const input = document.getElementById("userInput");
    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user");

    input.value = "";

    setTimeout(() => {

        let reply = "";

        if (message.toLowerCase().includes("hello")) {
            reply = "Hello! I'm BoseAI. 👋";

        } else if (message.toLowerCase().includes("your name")) {
            reply = "My name is BoseAI.";

        } else if (message.toLowerCase().includes("who are you")) {
            reply = "I'm BoseAI, your personal AI assistant.";

        } else {
            reply = "I'm still learning. Soon I'll have a real local AI brain.";

        }

        addMessage(reply, "ai");

    }, 500);
}


function addMessage(text, type) {

    const chat = document.getElementById("chat");

    const message = document.createElement("div");

    message.className = "message " + type;

    message.innerText = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
